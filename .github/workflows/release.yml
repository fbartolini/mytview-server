name: Release image

# Deliberate releases only: push a version tag (v0.4.0) and this builds the multi-arch
# image and publishes it to Docker Hub as fbartolini/mytview:<version> + :latest.
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token, not the
# account password).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fbartolini/mytview:latest
            fbartolini/mytview:${{ steps.v.outputs.version }}
